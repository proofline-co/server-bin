name: Compile and Release Binaries (Optimized Matrix)

on:
  repository_dispatch:
    types: [server-updated, server-release]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v1.0.0)"
        required: false
        default: ""
      source_ref:
        description: "Branch or commit in proofline-co/server to compile"
        required: false
        default: "main"

concurrency:
  group: release-${{ github.event.client_payload.ref || inputs.source_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare-meta:
    name: Resolve Version & Metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      source_ref: ${{ steps.meta.outputs.source_ref }}
    steps:
      - id: meta
        run: |
          if [ -n "${{ github.event.client_payload.tag }}" ]; then
            TAG="${{ github.event.client_payload.tag }}"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="v$(date +'%Y.%m.%d').${{ github.run_number }}"
          fi

          if [ -n "${{ github.event.client_payload.ref }}" ]; then
            SOURCE_REF="${{ github.event.client_payload.ref }}"
          elif [ -n "${{ inputs.source_ref }}" ]; then
            SOURCE_REF="${{ inputs.source_ref }}"
          else
            SOURCE_REF="main"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "source_ref=${SOURCE_REF}" >> "$GITHUB_OUTPUT"
          echo "Building: tag=${TAG}, source_ref=${SOURCE_REF}"

  build-matrix:
    name: Build (${{ matrix.target.name }})
    needs: prepare-meta
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: "linux-x64", bun_target: "bun-linux-x64", outfile: "proofline-server-linux-x64" }
          - { name: "linux-arm64", bun_target: "bun-linux-arm64", outfile: "proofline-server-linux-arm64" }
          - { name: "windows-x64", bun_target: "bun-windows-x64", outfile: "proofline-server-windows-x64.exe" }
    steps:
      - name: Checkout Source Repo
        uses: actions/checkout@v4
        with:
          repository: proofline-co/server
          ref: ${{ needs.prepare-meta.outputs.source_ref }}
          token: ${{ secrets.SERVER_SOURCE_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          path: source-repo

      - name: Setup Bun with Cache
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true

      - name: Install & Run Test Suite
        working-directory: source-repo
        env:
          NODE_ENV: test
          DB_ENGINE: memory
        run: |
          bun install --frozen-lockfile || bun install
          if [ "${{ matrix.target.name }}" = "linux-x64" ]; then
            echo "Running test suite once on primary runner..."
            bun test --parallel=1 --timeout 15000
          fi

      - name: Compile Standalone Binary
        working-directory: source-repo
        run: |
          mkdir -p ../dist
          ENTRY=$(test -f ./apps/api/src/server.ts && echo "./apps/api/src/server.ts" || echo "./src/server.ts")
          echo "Compiling for ${{ matrix.target.bun_target }} from $ENTRY..."
          bun build --compile --minify --target=${{ matrix.target.bun_target }} "$ENTRY" --outfile ../dist/${{ matrix.target.outfile }}

      - name: Binary Smoke Check (Linux x64 only)
        if: matrix.target.name == 'linux-x64'
        run: |
          chmod +x dist/${{ matrix.target.outfile }}
          ls -la dist/${{ matrix.target.outfile }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target.name }}
          path: dist/${{ matrix.target.outfile }}
          retention-days: 1

  publish-release:
    name: Aggregate & Publish Release
    needs: [prepare-meta, build-matrix]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Compute Checksums
        working-directory: release-assets
        run: |
          ls -la
          sha256sum * > checksums.sha256
          cat checksums.sha256

      - name: Create Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-meta.outputs.tag }}
          name: "Proofline Server ${{ needs.prepare-meta.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Proofline Server — Official Standalone Binaries

            High-throughput, self-contained binary distribution compiled with Bun runtime.
            Zero external Node.js runtime dependencies required.

            ### Build Info
            - **Commit / Ref:** `${{ needs.prepare-meta.outputs.source_ref }}`
            - **CI Run Number:** `${{ github.run_number }}`
            - **Architecture Matrix:** Linux x64, Linux ARM64, Windows x64

            ### Verification
            Validate integrity via `checksums.sha256`:
            ```bash
            sha256sum -c checksums.sha256
            ```
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
