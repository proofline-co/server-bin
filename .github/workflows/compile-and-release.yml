name: Compile and Release

on:
  repository_dispatch:
    types: [server-updated, server-release]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: false
        default: ""
      ref:
        description: "Source git ref in proofline-co/server"
        required: false
        default: "main"

concurrency:
  group: release-${{ github.event.client_payload.ref || inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      ref: ${{ steps.meta.outputs.ref }}
    steps:
      - id: meta
        run: |
          tag="${{ github.event.client_payload.tag || inputs.tag }}"
          if [ -z "$tag" ]; then
            tag="v$(date +'%Y.%m.%d').${{ github.run_number }}"
          fi

          ref="${{ github.event.client_payload.ref || inputs.ref || 'main' }}"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target.name }}
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: "linux-x64", bun: "bun-linux-x64", bin: "proofline-server-linux-x64" }
          - { name: "linux-arm64", bun: "bun-linux-arm64", bin: "proofline-server-linux-arm64" }
          - { name: "windows-x64", bun: "bun-windows-x64", bin: "proofline-server-windows-x64.exe" }
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: proofline-co/server
          ref: ${{ needs.resolve.outputs.ref }}
          token: ${{ secrets.SERVER_SOURCE_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          path: src

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true

      - name: Test
        working-directory: src
        env:
          NODE_ENV: test
          DB_ENGINE: memory
        run: |
          bun install --frozen-lockfile || bun install
          if [ "${{ matrix.target.name }}" = "linux-x64" ]; then
            bun test --parallel=1 --timeout 15000
          fi

      - name: Compile
        working-directory: src
        run: |
          mkdir -p ../dist
          entry="src/server.ts"
          [ -f "apps/api/src/server.ts" ] && entry="apps/api/src/server.ts"
          bun build --compile --minify --target=${{ matrix.target.bun }} "$entry" --outfile "../dist/${{ matrix.target.bin }}"

      - name: Verify binary
        if: matrix.target.name == 'linux-x64'
        run: |
          chmod +x dist/${{ matrix.target.bin }}
          test -x dist/${{ matrix.target.bin }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.name }}
          path: dist/${{ matrix.target.bin }}
          retention-days: 1

  release:
    name: Publish release
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum * > checksums.sha256
          cat checksums.sha256

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: "Proofline Server ${{ needs.resolve.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### Standalone Binaries
            Ref: `${{ needs.resolve.outputs.ref }}` (Build #${{ github.run_number }})
            Verify with `sha256sum -c checksums.sha256`.
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
